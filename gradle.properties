# The current version of the Nexori public API. Keep this aligned with the
# compatible Nexori plugin release.
version=2.5.0

# The group ID used for future Maven publishing.
maven_group=io.github.hyjn.nexori

# The version of Java used by your plugin. The game is built on Java 21 but
# actually runs on Java 25.
java_version=25

# nexori-api is a compile-time developer artifact, not the runtime Nexori mod.
# Server owners should install nexori-plugin.jar, which provides these API
# classes at runtime.
